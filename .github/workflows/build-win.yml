name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish installer assets to a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3,serialport
        env:
          npm_config_msvs_version: '2022'

      - name: Build app
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --config electron-builder.config.js --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output directory
        run: Get-ChildItem dist-packages -Recurse | Select-Object FullName
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: reyna-pos-windows
          path: |
            dist-packages/**/*.exe
            dist-packages/**/*.zip
            dist-packages/**/*.yml
            release/**/*.exe
            release/**/*.zip
            out/**/*.exe
            out/**/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-packages/**/*.exe
            dist-packages/**/*.zip
            dist-packages/**/*.yml
