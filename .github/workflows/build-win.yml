name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3,serialport
        env:
          npm_config_msvs_version: '2022'

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Build electron (TypeScript)
        run: npx tsc -p electron/tsconfig.json
        continue-on-error: true

      - name: Check build outputs
        shell: pwsh
        run: |
          echo "=== dist/renderer ==="
          Get-ChildItem dist/renderer -ErrorAction SilentlyContinue | Select-Object Name
          echo "=== electron/dist ==="
          Get-ChildItem electron/dist -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Package Windows installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List all exe files after packaging
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: reyna-pos-windows
          path: dist-packages/**
          if-no-files-found: warn
          retention-days: 30
