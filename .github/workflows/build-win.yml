name: Build Desktop Installers

on:
  push:
    branches:
      - main
      - review/**
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish installer assets to a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            package_command: npx electron-builder --win --config electron-builder.config.js --publish never
            artifact_name: reyna-pos-windows
            artifact_paths: |
              dist-packages/**/*.exe
              dist-packages/**/*.zip
              dist-packages/**/*.yml
              release/**/*.exe
              release/**/*.zip
              out/**/*.exe
              out/**/*.zip
          - name: macOS
            os: macos-latest
            package_command: npx electron-builder --mac --config electron-builder.config.js --publish never
            artifact_name: reyna-pos-macos
            artifact_paths: |
              dist-packages/**/*.dmg
              dist-packages/**/*.zip
              dist-packages/**/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3,serialport
        env:
          npm_config_msvs_version: '2022'

      - name: Build app
        run: npm run build

      - name: Package installer
        run: ${{ matrix.platform.package_command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output directory
        run: |
          if [ -d dist-packages ]; then
            find dist-packages -type f
          fi
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ matrix.platform.artifact_paths }}
